name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assemble --no-daemon

      - name: Run unit tests
        run: ./gradlew unitTest --no-daemon

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/owasp-dc-data
          key: owasp-dc-${{ github.run_id }}
          restore-keys: |
            owasp-dc-

      - name: Run OWASP Dependency-Check (fail on CVSS >= 7.0)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'uc-framework-upgrade-monolith-to-microservices'
          path: '.'
          format: 'HTML'
          out: 'build/reports/dependency-check'
          args: >
            --failOnCVSS 7
            --data ${{ github.workspace }}/owasp-dc-data

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
