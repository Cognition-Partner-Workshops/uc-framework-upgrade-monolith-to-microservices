name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Run unit tests
        run: ./gradlew unitTest --no-daemon

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Check NVD API Key availability
        id: nvd_check
        run: |
          if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::NVD_API_KEY secret not configured. OWASP Dependency-Check requires an NVD API key to download vulnerability data. Get a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repository secret named NVD_API_KEY."
          fi

      - name: Cache OWASP Dependency-Check data
        if: steps.nvd_check.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: ${{ runner.os }}-owasp-dc-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-owasp-dc-

      - name: Install OWASP Dependency-Check
        if: steps.nvd_check.outputs.available == 'true'
        run: |
          DC_VERSION="10.0.4"
          wget -q "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -q "dependency-check-${DC_VERSION}-release.zip"
          chmod +x dependency-check/bin/dependency-check.sh

      - name: Run OWASP Dependency-Check
        if: steps.nvd_check.outputs.available == 'true'
        run: |
          mkdir -p reports
          ./dependency-check/bin/dependency-check.sh \
            --project "uc-framework-upgrade-monolith-to-microservices" \
            --scan . \
            --format HTML \
            --format JSON \
            --failOnCVSS 7 \
            --out reports \
            --data ~/.dependency-check/data \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}"

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always() && steps.nvd_check.outputs.available == 'true'
        with:
          name: dependency-check-report
          path: reports/
