name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assemble --no-daemon

      - name: Run unit tests
        run: ./gradlew unitTest --no-daemon

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/owasp-dc-data
          key: owasp-dc-${{ github.run_id }}
          restore-keys: |
            owasp-dc-

      - name: Install OWASP Dependency-Check
        run: |
          DC_VERSION="10.0.4"
          wget -q "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -q "dependency-check-${DC_VERSION}-release.zip"

      - name: Run OWASP Dependency-Check (fail on CVSS >= 7.0)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            NVD_ARGS="--nvdApiKey $NVD_API_KEY"
          fi
          ./dependency-check/bin/dependency-check.sh \
            --project uc-framework-upgrade-monolith-to-microservices \
            --scan . \
            --format HTML \
            --format JSON \
            --out build/reports/dependency-check \
            --failOnCVSS 7 \
            --data ${{ github.workspace }}/owasp-dc-data \
            $NVD_ARGS

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
